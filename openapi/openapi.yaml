        message: Rentang tanggal maksimal 31 hari, termasuk tanggal awal dan akhir.
    error-400-date-range:
      summary: Rentang tanggal tidak valid
      value:
        code: INVALID_DATE_RANGE
        message: Tanggal to tidak boleh sebelum from.
    error-401:
      summary: Token tidak sah
      value:
        code: UNAUTHORIZED
        message: Sesi berakhir, silakan login kembali.
    error-403:
      summary: Akses ditolak
      value:
        code: FORBIDDEN
        message: Anda tidak memiliki akses ke data ini.
    error-404-employee:
      summary: employeeId tidak dikenal
      value:
        code: EMPLOYEE_NOT_FOUND
        message: Karyawan tidak ditemukan.
    error-404-leave-request:
      summary: leaveRequestId tidak dikenal
      value:
        code: LEAVE_REQUEST_NOT_FOUND
        message: Pengajuan cuti tidak ditemukan.
    error-404-attachment:
      summary: attachmentId tidak dikenal
      value:
        code: ATTACHMENT_NOT_FOUND
        message: Lampiran tidak ditemukan.
    error-404-notification:
      summary: notificationId tidak dikenal
      value:
        code: NOTIFICATION_NOT_FOUND
        message: Notifikasi tidak ditemukan.
    error-409-date-overlap:
      summary: Tanggal bentrok
      value:
        code: DATE_OVERLAP
        message: Tanggal cuti bertumpuk dengan pengajuan lain milik Anda (termasuk draf). Pilih tanggal lain atau ubah pengajuan yang sudah ada.
    error-409-invalid-state:
      summary: Pengajuan sudah diproses
      value:
        code: INVALID_STATE
        message: Pengajuan ini sudah diproses. Muat ulang halaman.
    error-409-cancel-not-allowed:
      summary: Pengajuan tidak dapat dibatalkan
      value:
        code: INVALID_STATE
        message: Pengajuan tidak dapat dibatalkan karena status sudah final atau tanggal mulai sudah lewat.
    error-422-insufficient-balance:
      summary: Melebihi saldo dapat diajukan
      value:
        code: INSUFFICIENT_BALANCE
        message: Saldo dapat diajukan 2 hari, pengajuan 4 hari kerja.
    error-422-not-eligible:
      summary: Masa kerja belum 12 bulan
      value:
        code: NOT_ELIGIBLE
        message: Anda berhak cuti tahunan mulai 2027-02-01 (12 bulan masa kerja).
    error-422-deadline-h7:
      summary: Kurang dari H-7 hari kerja
      value:
        code: DEADLINE_H7
        message: Cuti tahunan diajukan paling lambat 7 hari kerja sebelum tanggal mulai.
    error-422-cross-year:
      summary: Melewati 31 Desember
      value:
        code: CROSS_YEAR_NOT_ALLOWED
        message: Cuti tahunan tidak boleh melewati 31 Desember. Ajukan dalam dua pengajuan terpisah.
    error-422-attachment-required:
      summary: Lampiran wajib
      value:
        code: ATTACHMENT_REQUIRED
        message: Surat dokter wajib dilampirkan.
    error-422-sick-backdate-limit:
      summary: Susulan melewati 3 hari kerja
      value:
